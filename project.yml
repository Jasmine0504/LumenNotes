name: LumenNotes
options:
  bundleIdPrefix: com.lumen
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    VERSIONING_SYSTEM: apple-generic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  LumenNotes:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumen.notes
        PRODUCT_NAME: LumenNotes
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/LumenNotes.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: LumenNotesWidgets
        embed: true

  LumenNotesWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Sources/Features/System/QuickCaptureIntent.swift
      - path: Sources/Features/System/SharedCapture.swift
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumen.notes.widgets
        PRODUCT_NAME: LumenNotesWidgets
        INFOPLIST_FILE: Resources/LumenNotesWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/LumenNotesWidgets.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

  LumenNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LumenNotesTests
    dependencies:
      - target: LumenNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumen.notes.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LumenNotes:
    build:
      targets:
        LumenNotes: all
        LumenNotesWidgets: all
        LumenNotesTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LumenNotesTests
